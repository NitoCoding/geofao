<dialog id="form-modal"
        class="modal"
        onclose="document.getElementById('modal-body').innerHTML = ''">
    <div class="modal-box">
        <div id="modal-body"></div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>
