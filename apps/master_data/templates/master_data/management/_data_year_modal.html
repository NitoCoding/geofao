<!-- DataYear Modal -->
<div id="data-year-modal" class="modal modal-open hidden z-[9999]"
     _="on load remove .hidden from me">
    <div class="modal-box rounded-xl max-w-md bg-base-100 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold text-base-content">
                {% if instance %}Edit{% else %}Tambah{% endif %} Tahun Data
            </h3>
            <button class="btn btn-ghost btn-sm btn-square"
                    _="on click add .hidden to #data-year-modal">
                <i class="bi bi-x text-lg"></i>
            </button>
        </div>

        <form hx-post="{% url 'master_data:management_data_year_save' %}"
              hx-target="#data-year-panel"
              hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful) document.querySelector('#data-year-modal').classList.add('hidden')">
            {% if instance %}<input type="hidden" name="pk" value="{{ instance.pk }}">{% endif %}

            <div class="space-y-3">
                <div>
                    <label class="label py-0.5">
                        <span class="label-text text-xs font-medium">Tahun <span class="text-error">*</span></span>
                    </label>
                    {{ form.year }}
                    {% if form.year.errors %}<p class="text-error text-xs mt-1">{{ form.year.errors.0 }}</p>{% endif %}
                </div>
                <div>
                    <label class="label cursor-pointer justify-start gap-3 py-0.5">
                        {{ form.is_active }}
                        <span class="label-text text-xs font-medium">Aktif</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-base-200">
                <button type="button" class="btn btn-ghost btn-sm"
                        _="on click add .hidden to #data-year-modal">
                    Batal
                </button>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg me-1"></i>Simpan
                </button>
            </div>
        </form>
    </div>
    <div class="modal-backdrop" _="on click add .hidden to #data-year-modal"></div>
</div>
