{# Right Panel: Kriteria Kesesuaian #}

<div class="flex items-center justify-between mb-3">
  <h3 class="text-sm font-bold text-base-content flex items-center gap-2">
    <i class="bi bi-sliders text-primary"></i> Kriteria Kesesuaian
    <span class="badge badge-xs badge-ghost">{{ criteria|length }}</span>
  </h3>
  <button class="btn btn-primary btn-xs"
          hx-get="{% url 'master_data:management_criteria_modal' %}"
          hx-target="#modal-container"
          hx-swap="innerHTML">
    <i class="bi bi-plus-lg"></i> Tambah
  </button>
</div>

<!-- Filter by Commodity -->
<form class="mb-3"
      hx-get="{% url 'master_data:management_right' %}"
      hx-target="#right-panel"
      hx-trigger="change from:select">
  <select name="commodity" class="select select-bordered select-sm w-full">
    <option value="">Semua Komoditas</option>
    {% for com in all_commodities %}
      <option value="{{ com.id }}" {% if selected_commodity == com.id|stringformat:"s" %}selected{% endif %}>
        {{ com.name }}
      </option>
    {% endfor %}
  </select>
</form>

{% if criteria %}
<div class="overflow-x-auto rounded-lg border border-base-200">
  <table class="table table-sm table-zebra w-full">
    <thead class="bg-base-200">
      <tr>
        <th class="text-xs">Nama</th>
        <th class="text-xs">Komoditas</th>
        <th class="text-xs">Tipe</th>
        <th class="text-xs w-10"></th>
      </tr>
    </thead>
    <tbody>
      {% for item in criteria %}
      <tr class="hover">
        <td class="text-sm font-medium">{{ item.name }}</td>
        <td><span class="badge badge-xs badge-outline">{{ item.commodity.name }}</span></td>
        <td><span class="badge badge-xs badge-ghost">{{ item.get_data_type_display }}</span></td>
        <td>
          <div class="flex gap-0.5">
            <button class="btn btn-ghost btn-xs"
                    hx-get="{% url 'master_data:management_criteria_modal' %}?pk={{ item.pk }}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    title="Edit">
              <i class="bi bi-pencil text-xs"></i>
            </button>
            <button class="btn btn-ghost btn-xs text-error"
                    hx-delete="{% url 'master_data:management_criteria_delete' item.pk %}"
                    hx-target="#right-panel"
                    hx-confirm="Hapus kriteria '{{ item.name }}'?"
                    title="Hapus">
              <i class="bi bi-trash text-xs"></i>
            </button>
          </div>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% else %}
  <div class="text-center py-8 opacity-50">
    <i class="bi bi-inbox text-3xl"></i>
    <p class="text-xs mt-1">Belum ada kriteria kesesuaian.</p>
  </div>
{% endif %}
