{% extends 'base.html' %}
{% block title %}Komoditas | {{ block.super }}{% endblock %}
{% block page_title %}Komoditas{% endblock %}
{% block content %}
<!-- Page Header (Static - never refreshes) -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
  <div class="flex gap-2">
    <a
      href="{% url 'master_data:commodity_list' %}"
      class="btn btn-ghost">
      <i class="bi bi-arrow-clockwise"></i>
    </a>
    <a
      href="{% url 'master_data:commodity_create' %}"
      class="btn btn-primary">
      <i class="bi bi-plus-lg me-2"></i>Tambah Komoditas Baru
    </a>
  </div>
</div>

<!-- Commodity Content -->
<div id="commodity-content">
  {% include "master_data/commodity_list_content.html" %}
</div>
{% endblock %}
