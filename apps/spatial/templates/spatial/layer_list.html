{% extends "base.html" %}

{% block title %}Layers — GeoAibarru{% endblock %}
{% block page_title %}Spatial Layers{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">

  <!-- Page Header -->
  <div class="bg-base-100 rounded-xl card-elevated p-6 mb-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-xl font-bold text-base-content">Daftar Layer</h2>
        <p class="text-sm text-base-content/60 mt-0.5">Kelola data spasial Anda</p>
      </div>
      <div class="flex gap-2 flex-shrink-0">
        <button class="btn btn-sm btn-outline"
                hx-get="{% url 'spatial:layer_list_table' %}"
                hx-trigger="load, click"
                hx-target="#layer-content"
                >
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <a href="{% url 'spatial:layer_upload' %}" class="btn btn-sm btn-primary">
          <i class="bi bi-plus-lg me-1.5"></i>Upload Layer
        </a>
      </div>
    </div>
  </div>

  <!-- Search & Filter -->
  <div class="bg-base-100 rounded-xl card-elevated p-4 mb-6">
    <form id="filter-form"
          method="get"
          action="{% url 'spatial:layer_list_table' %}"
          class="flex flex-col md:flex-row gap-3"
          hx-get="{% url 'spatial:layer_list_table' %}"
          hx-target="#layer-content"
          hx-trigger="change delay:300ms, keyup changed delay:500ms"
          hx-include="#filter-form [name='page']">

      <!-- Search -->
      <div class="flex-1 min-w-0">
        <input type="text"
               placeholder="Cari layer..."
               class="input input-bordered text-sm w-full"
               name="search"
               id="search-input"
               value="{{ search|default:'' }}" />
      </div>

      <!-- Year Filter -->
      <select class="select select-bordered text-sm"
              id="year-filter"
              name="year">
        <option value="">Semua Tahun</option>
        {% for dy in data_years %}
        <option value="{{ dy.year }}" {% if year|add:'0' == dy.year %}selected{% endif %}>
          {{ dy.name|default:dy.year }}
        </option>
        {% endfor %}
      </select>

      <!-- Category Filter -->
      <select class="select select-bordered text-sm"
              id="category-filter"
              name="category">
        <option value="">Semua Kategori</option>
        {% for value, label in data_categories %}
        <option value="{{ value }}" {% if category == value %}selected{% endif %}>
          {{ label }}
        </option>
        {% endfor %}
      </select>
    </form>
  </div>

  <!-- Layer Table -->
  <div id="layer-content">
    <div class="flex justify-center items-center py-12">
      <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
  </div>

</div>
{% endblock %}
