<!-- Edit Layer Metadata Modal -->
<div id="management-modal" class="modal modal-open" role="dialog"
     _="on closeModal from body add .hidden to me">
    <div class="modal-box max-w-lg">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold">
                <i class="bi bi-pencil text-info me-2"></i>Edit Metadata Layer
            </h3>
            <button class="btn btn-sm btn-ghost btn-square"
                    _="on click add .hidden to #management-modal">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <p class="text-sm text-base-content/60 mb-4">
            Mengedit metadata untuk <strong>{{ layer.name }}</strong>
            <span class="text-xs text-base-content/40">({{ layer.table_name }})</span>
        </p>

        <form method="post"
              hx-post="{% url 'spatial:layer_edit' layer.pk %}"
              hx-target="#toast-container"
              hx-swap="afterbegin"
              hx-on::after-request="htmx.ajax('GET', '{% url 'spatial:layer_list_table' %}?view=panel', {target: '#layer-list-content'})">
            {% csrf_token %}

            <!-- Nama Layer -->
            <div class="form-control w-full mb-4">
                <label class="label py-1" for="{{ form.name.id_for_label }}">
                    <span class="label-text text-sm font-medium">{{ form.name.label }}</span>
                </label>
                <input type="text"
                       name="{{ form.name.name }}"
                       id="{{ form.name.id_for_label }}"
                       class="input input-bordered input-sm w-full"
                       value="{{ form.name.value|default:'' }}"
                       placeholder="Nama layer">
                {% if form.name.errors %}
                <label class="label py-1">
                    <span class="label-text-alt text-error">{{ form.name.errors.0 }}</span>
                </label>
                {% endif %}
            </div>

            <!-- Kategori Layer -->
            <div class="form-control w-full mb-4">
                <label class="label py-1" for="{{ form.layer_category.id_for_label }}">
                    <span class="label-text text-sm font-medium">{{ form.layer_category.label }}</span>
                </label>
                <select name="{{ form.layer_category.name }}"
                        id="{{ form.layer_category.id_for_label }}"
                        class="select select-bordered select-sm w-full">
                    {% for value, label in form.layer_category.field.choices %}
                    <option value="{{ value }}" {% if form.layer_category.value == value|stringformat:"s" %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
                {% if form.layer_category.errors %}
                <label class="label py-1">
                    <span class="label-text-alt text-error">{{ form.layer_category.errors.0 }}</span>
                </label>
                {% endif %}
            </div>

            <!-- Tahun Data -->
            <div class="form-control w-full mb-4">
                <label class="label py-1" for="{{ form.data_year.id_for_label }}">
                    <span class="label-text text-sm font-medium">{{ form.data_year.label }}</span>
                </label>
                <select name="{{ form.data_year.name }}"
                        id="{{ form.data_year.id_for_label }}"
                        class="select select-bordered select-sm w-full">
                    <option value="">Pilih Tahun</option>
                    {% for choice in form.data_year.field.queryset %}
                    <option value="{{ choice.pk }}" {% if form.data_year.value|stringformat:"s" == choice.pk|stringformat:"s" %}selected{% endif %}>
                        {{ choice.name|default:choice.year }}
                    </option>
                    {% endfor %}
                </select>
                {% if form.data_year.errors %}
                <label class="label py-1">
                    <span class="label-text-alt text-error">{{ form.data_year.errors.0 }}</span>
                </label>
                {% endif %}
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-2 pt-2 border-t border-base-200">
                <button type="button"
                        class="btn btn-ghost btn-sm"
                        _="on click add .hidden to #management-modal">
                    Batal
                </button>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="bi bi-check-lg me-1.5"></i>Simpan
                </button>
            </div>
        </form>
    </div>
</div>
