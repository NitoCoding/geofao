<!-- info_panel.html -->
<div class="card bg-base-100 shadow-lg border-t-4 border-primary">
  <!-- Header Panel -->
  <div class="card-body p-4">
    <div class="flex items-center justify-between">
      <h3 class="card-title text-base font-bold flex items-center gap-2">
        <div class="bg-primary/10 p-1.5 rounded-lg text-primary">
          <i class="bi bi-info-circle-fill text-lg"></i>
        </div>
        <span id="info-panel-title">Detail Lokasi</span>
      </h3>
      <button class="btn btn-ghost btn-xs btn-circle text-base-content/50 hover:text-error hover:bg-error/10"
              id="close-info-panel"
              title="Tutup Panel">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <!-- Content: Data Fitur -->
    <div id="info-panel-content" class=" mt-2 space-y-4">
      <!-- Badges Status -->
      <div class="flex flex-wrap gap-2 mb-4">
        <div class="badge badge-outline badge-primary gap-1 text-xs py-3">
          <i class="bi bi-layers"></i> <span id="layer-badge-name">{{ layer_name }}</span>
        </div>
        <div class="badge badge-ghost gap-1 text-xs">
          <i class="bi bi-clock"></i> <span id="timestamp-badge">Updated now</span>
        </div>
      </div>
      <!-- Card: Atribut -->
      <div class="card bg-base-200">
        <div class="card-body p-3">
          <h4 class="card-title text-sm font-bold flex items-center gap-2">
            <i class="bi bi-list-ul text-base-content"></i>
            <span>Atribut Lokasi</span>
          </h4>
          <div class="overflow-x-auto max-h-40 overflow-y-auto pr-1 custom-scrollbar">
            <table class="table table-zebra table-xs w-full text-base-content">
              <tbody id="attribute-table-body">
                {% for prop in properties %}
                  <tr>
                    <td class="font-medium text-xs">{{ prop.label }} ({{ prop.key }})</td>
                    <td class="text-xs">{{ prop.value|default:"-" }}</td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
      
      <!-- Footer: Koordinat -->
      <div class="divider my-2"></div>
      <div class="flex items-center justify-between gap-2">
        <div class="text-xs opacity-50 truncate">
          Koordinat: <span id="info-coords" class="font-mono">{{ lat }}, {{ lng }}</span>
        </div>
        <button class="btn btn-sm btn-ghost gap-1" title="Salin Data">
          <i class="bi bi-clipboard"></i>
        </button>
      </div>
    </div>
  </div>
</div>
<style>
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #cbd5e1;
        border-radius: 20px;
    }

    .custom-scrollbar:hover::-webkit-scrollbar-thumb {
        background-color: #94a3b8;
    }
</style>
