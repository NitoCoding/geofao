{% load static %}
<!doctype html>
<html lang="id" data-theme="system">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>Login - Sistem Informasi Kesesuaian Lahan</title>

    <!-- Tailwind + DaisyUI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
    
    <!-- HTMX -->
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <style>
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }
    </style>
</head>
<body class="min-h-screen flex text-base-content bg-base-600">

    <main id="main-content" class="flex-1 flex flex-col">
        <div class="flex-grow p-6 overflow-auto">
            <div class="flex items-center justify-center min-h-[70vh]">
                <div class="card w-full max-w-md bg-base-100 shadow-2xl">
                    <div class="card-body">

                        <!-- Logo/Header -->
                        <div class="text-center mb-6">
                            <div class="bg-primary/10 text-primary p-4 rounded-full inline-flex mb-4">
                                <i class="bi bi-person-circle text-4xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold">Login</h1>
                            <p class="text-base-content/70">
                                Masuk ke Sistem Informasi Kesesuaian Lahan
                            </p>
                        </div>

                        <!-- Container untuk HTMX swap -->
                        <div id="login-form-container">
                            {% include 'partials/login_form.html' %}
                        </div>

                        <!-- Footer Info -->
                        <div class="divider"></div>
                        <div class="text-center text-sm text-base-content/70">
                            <p class="mb-2">
                                <i class="bi bi-info-circle me-1"></i>
                                Gunakan akun admin Django untuk login
                            </p>
                            <a href="{% url 'admin:index' %}" 
                               class="link link-primary link-hover">
                                <i class="bi bi-shield-lock me-1"></i>
                                atau login melalui Admin Panel
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- HTMX CSRF Setup -->
    <script>
        document.addEventListener('htmx:configRequest', function(event) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            if (csrfToken) {
                event.detail.headers['X-CSRFToken'] = csrfToken;
            }
        });
    </script>

</body>
</html>
