<form id="login-form"
      hx-post="{% url 'login' %}"
      hx-swap="outerHTML"
      hx-target="#login-form-container"
      class="space-y-4">

    {% csrf_token %}

    <!-- Kirim next parameter -->
    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <!-- Username Field -->
    <div class="form-control">
        <label class="label" for="id_username">
            <span class="label-text">Username</span>
            <span class="label-text-alt text-error">*</span>
        </label>
        <div class="join w-full">
            <span class="join-item btn btn-ghost"><i class="bi bi-person"></i></span>
            {{ form.username }}
        </div>
        {{ form.username.errors }}
    </div>

    <!-- Password Field -->
    <div class="form-control">
        <label class="label" for="id_password">
            <span class="label-text">Password</span>
            <span class="label-text-alt text-error">*</span>
        </label>
        <div class="join w-full">
            <span class="join-item btn btn-ghost"><i class="bi bi-lock"></i></span>
            {{ form.password }}
        </div>
        {{ form.password.errors }}
    </div>

    <div class="form-control">
        <label class="label cursor-pointer justify-start gap-3">
            {{ form.remember_me }}
            <span class="label-text">{{ form.remember_me.label }}</span>
        </label>
    </div>

    <!-- Non-field errors -->
    {% if form.non_field_errors %}
    <div class="alert alert-error">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <div>
            <h3 class="font-bold">Login Gagal!</h3>
            {% for error in form.non_field_errors %}
                <p class="text-xs">{{ error }}</p>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <!-- Submit Button -->
    <button type="submit" class="btn btn-primary w-full">
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Login
    </button>
</form>
