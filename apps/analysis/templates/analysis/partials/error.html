<!-- Error Template untuk Analisis Gagal -->
<div class="card bg-error text-error-content shadow-xl">
    <div class="card-body">
        <div class="flex items-start gap-4">
            <i class="bi bi-exclamation-triangle-fill text-4xl"></i>
            <div class="flex-1">
                <h2 class="card-title">Analisis Gagal</h2>
                <p class="mt-2">{{ error_message }}</p>
                
                {% if result.error_message %}
                <div class="mt-4 p-4 bg-base-100 text-base-content rounded-lg">
                    <p class="font-mono text-sm">{{ result.error_message }}</p>
                </div>
                {% endif %}
                
                <div class="mt-4 text-sm opacity-80">
                    <p><strong>Komoditas:</strong> {{ result.commodity.name }}</p>
                    <p><strong>Layer:</strong> {{ result.base_layer.name }}</p>
                    <p><strong>Waktu:</strong> {{ result.created_at|date:"d M Y H:i" }}</p>
                </div>
            </div>
        </div>
        
        <div class="card-actions justify-end mt-4">
            <button class="btn btn-ghost" onclick="window.location.href='{% url 'analysis:land_suitability' %}'">
                <i class="bi bi-arrow-left"></i>
                Kembali
            </button>
            <button class="btn btn-primary" 
                    hx-post="{% url 'analysis:start_analysis' %}"
                    hx-vals='{"commodity_ids": ["{{ result.commodity.id }}"], "layer_id": "{{ result.base_layer.id }}"}'
                    hx-target="#analysis-container"
                    hx-swap="innerHTML">
                <i class="bi bi-arrow-clockwise"></i>
                Coba Lagi
            </button>
        </div>
    </div>
</div>
