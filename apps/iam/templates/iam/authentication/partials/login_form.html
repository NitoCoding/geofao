<form id="login-form"
      hx-post="{% url 'iam:login' %}"
      action="{% url 'iam:login' %}"
      hx-swap="innerHTML"
      hx-target="#login-form-container"
      class="space-y-4">

    {% csrf_token %}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    {% if form.non_field_errors %}
    <div class="bg-red-50 border border-red-200 rounded-xl p-3 flex items-start gap-2.5">
        <i class="bi bi-exclamation-triangle-fill text-red-500 mt-0.5 text-base"></i>
        <div>
            {% for error in form.non_field_errors %}
                <p class="text-xs text-red-700">{{ error }}</p>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    <!-- Email Field -->
    <div>
        <label for="id_username" class="sr-only">Your Email</label>
        <div class="relative">
            <i class="bi bi-at absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[17px]"></i>
            <input type="text" name="username" id="id_username"
                   placeholder="Your Email"
                   value="{{ form.username.value|default:'' }}"
                   class="w-full py-[11px] pl-10 pr-4 rounded-xl border border-[#E8EDF2] text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-[#6366F1] focus:ring-3 focus:ring-[#6366F1]/10 transition-all"
                   required>
        </div>
        {% if form.username.errors %}
            <p class="mt-1 text-xs text-red-500">{{ form.username.errors.0 }}</p>
        {% endif %}
    </div>

    <!-- Password Field -->
    <div>
        <label for="id_password" class="sr-only">Your Password</label>
        <div class="relative">
            <i class="bi bi-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[17px]"></i>
            <input type="password" name="password" id="id_password"
                   placeholder="Your Password"
                   class="w-full py-[11px] pl-10 pr-4 rounded-xl border border-[#E8EDF2] text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-[#6366F1] focus:ring-3 focus:ring-[#6366F1]/10 transition-all"
                   required>
        </div>
        {% if form.password.errors %}
            <p class="mt-1 text-xs text-red-500">{{ form.password.errors.0 }}</p>
        {% endif %}
    </div>

    <!-- Options Row -->
    <div class="flex items-center justify-between">
        <label class="flex items-center gap-1.5 text-sm text-slate-500 cursor-pointer">
            <input type="checkbox" name="remember" class="w-4 h-4 accent-[#4B00FE] cursor-pointer">
            Remember me
        </label>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="w-full py-3 px-4 rounded-full bg-gradient-to-r from-[#6366F1] to-[#4B00FE] text-white text-sm font-semibold transition-opacity hover:opacity-90 active:opacity-80 flex items-center justify-center gap-2">
        Sign In
    </button>
</form>
