{% extends 'base.html' %}
{% block title %}Hapus User | {{ block.super }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body text-center">
      <div class="mx-auto mb-4 text-error">
        <i class="bi bi-exclamation-triangle text-5xl"></i>
      </div>
      <h2 class="card-title justify-center">Konfirmasi Hapus</h2>
      <p class="py-4">
        Apakah Anda yakin ingin menghapus user <strong>"{{ object.username }}"</strong>?
      </p>
      <p class="text-sm text-base-content/50">Tindakan ini tidak dapat dibatalkan.</p>
      <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="card-actions justify-center">
          <a href="{% url 'iam:user_list' %}" class="btn btn-ghost">Batal</a>
          <button type="submit" class="btn btn-error">
            <i class="bi bi-trash me-2"></i>Hapus
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
