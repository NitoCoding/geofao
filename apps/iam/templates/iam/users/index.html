{% extends 'base.html' %}
{% block title %}User | {{ block.super }}{% endblock %}
{% block page_title %}Manajemen User{% endblock %}

{% block content %}
<!-- Page Header -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
  <div>
    <h2 class="text-3xl font-bold">User</h2>
    <p class="text-base-content/70">Kelola data pengguna sistem</p>
  </div>
  <div class="flex gap-2">
    <button class="btn btn-primary"
            hx-get="{% url 'iam:user_create' %}"
            hx-target="#modalBody">
      <i class="bi bi-plus-lg me-2"></i>Tambah User
    </button>
  </div>
</div>

<!-- User Content -->
<div id="user-content"
     hx-get="{% url 'iam:user_list' %}"
     hx-trigger="userSaved from:body">
  {% include "iam/users/datatable.html" %}
</div>

{% endblock %}
