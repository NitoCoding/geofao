<form method="post"
      hx-post="{% url 'login' %}"
      hx-swap="innerHTML"
      hx-target="#login-form-container"
      class="space-y-4">

  {% csrf_token %}
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <!-- Error messages -->
  {% if form.non_field_errors %}
    <div class="alert alert-error shadow-sm">
      <i class="bi bi-exclamation-triangle"></i>
      <span>{{ form.non_field_errors.0 }}</span>
    </div>
  {% endif %}

  <!-- Username -->
  <div class="form-control">
    <label class="label" for="{{ form.username.id_for_label }}">
      <span class="label-text">{{ form.username.label }}</span>
    </label>
    {{ form.username }}
    {% if form.username.errors %}
      <label class="label">
        <span class="label-text-alt text-error">{{ form.username.errors.0 }}</span>
      </label>
    {% endif %}
  </div>

  <!-- Password -->
  <div class="form-control">
    <label class="label" for="{{ form.password.id_for_label }}">
      <span class="label-text">{{ form.password.label }}</span>
    </label>
    {{ form.password }}
    {% if form.password.errors %}
      <label class="label">
        <span class="label-text-alt text-error">{{ form.password.errors.0 }}</span>
      </label>
    {% endif %}
  </div>

  <!-- Submit -->
  <div class="form-control mt-6">
    <button type="submit" class="btn btn-primary w-full">
      <i class="bi bi-box-arrow-in-right me-2"></i>
      Masuk
    </button>
  </div>
</form>
