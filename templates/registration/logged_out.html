{# Django Auth Logout Template #}
{# Location: templates/registration/logged_out.html #}

{% extends 'base.html' %}

{% block title %}Logout | {{ block.super }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
  <div class="card w-full max-w-md bg-base-100 shadow-2xl">
    <div class="card-body text-center">
      <!-- Success Icon -->
      <div class="text-success mb-6">
        <i class="bi bi-check-circle-fill text-6xl"></i>
      </div>

      <h1 class="text-2xl font-bold mb-2">Berhasil Logout!</h1>
      <p class="text-base-content/70 mb-6">Anda telah keluar dari sistem.</p>

      <div class="card-actions justify-center">
        <a href="{% url 'login' %}" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Login Kembali
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
